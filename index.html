<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
:root{--bg:#eef2f8;--card:#fff;--ink:#14285a;--mut:#6b7a99;--line:#d5deee;--pri:#1b3a8a;--slot:#cfdcf3;--slot2:#b9cbe9;--hl:#f2a900;--ok:#1a7f4b;--bad:#c0392b;--ground:#e3e9f4;--red:#ebb9b3;--zone:#f7e6c4;--zl:#e2cf9f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1630;--card:#16234a;--ink:#e8eefc;--mut:#9aaad0;--line:#2a3a6a;--pri:#4d7be0;--slot:#2a3d72;--slot2:#334a86;--ground:#121d3d;--red:#6b3a42;--zone:#4a4130;--zl:#6b5d3d}}
:root[data-theme="dark"]{--bg:#0d1630;--card:#16234a;--ink:#e8eefc;--mut:#9aaad0;--line:#2a3a6a;--pri:#4d7be0;--slot:#2a3d72;--slot2:#334a86;--ground:#121d3d;--red:#6b3a42;--zone:#4a4130;--zl:#6b5d3d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif;display:flex;flex-direction:column;min-height:100vh}
header{background:#14285a;color:#fff;padding:14px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:20px}header small{display:block;opacity:.75;font-size:13px;margin-top:2px;direction:ltr;text-align:right}
.stats{display:flex;gap:10px}.st{background:rgba(255,255,255,.12);border-radius:10px;padding:6px 14px;text-align:center;min-width:80px}.st b{font-size:20px;display:block}.st span{font-size:12px;opacity:.8}
.bar{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px;align-items:center;background:var(--card);border-bottom:1px solid var(--line)}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 12px}
button.p{background:var(--pri);color:#fff;border-color:var(--pri)}button.d{color:var(--bad);border-color:var(--bad)}
#q{min-width:200px;flex:1;max-width:320px}#n{width:70px}
main{flex:1;position:relative;min-height:420px}
svg{width:100%;height:100%;position:absolute;inset:0;touch-action:none;cursor:grab;background:var(--bg)}
.zoom{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:6px;z-index:2}.zoom button{width:38px;padding:6px}
.leg{position:absolute;right:12px;bottom:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px;display:flex;gap:12px;z-index:2}
.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-inline-end:5px;vertical-align:-2px}
#tip{position:fixed;pointer-events:none;background:#14285a;color:#fff;padding:7px 11px;border-radius:8px;font-size:13px;display:none;z-index:9;line-height:1.6}
.slot{cursor:pointer}.slot:hover .sp{fill:var(--slot2)}
.hl{animation:pl 1s infinite}@keyframes pl{50%{opacity:.35}}
footer{text-align:center;padding:12px;font-size:13px;color:var(--mut);direction:ltr}
.ov{position:fixed;inset:0;background:rgba(10,20,50,.5);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
.dlg{background:var(--card);border-radius:14px;padding:18px;width:min(520px,100%);max-height:90vh;overflow:auto}
.dlg h3{margin:0 0 12px}.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f label{font-size:13px;color:var(--mut);display:flex;flex-direction:column;gap:4px}.f .w{grid-column:1/-1}
.row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.row .sp2{flex:1}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:5px;border-bottom:1px solid var(--line);text-align:right}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#14285a;color:#fff;padding:9px 16px;border-radius:10px;display:none;z-index:11}
</style>
</head>
<body>
<header>
 <div><h1>ساعد للأنظمة المرورية</h1><small>ساحات الحجز | SAAED Impound Yard – Lane K1</small></div>
 <div class="stats"><div class="st"><b id="sc">0</b><span>سيارات</span></div><div class="st"><b id="se">0</b><span>مواقف فارغة</span></div><div class="st"><b id="st">0</b><span>إجمالي المواقف</span></div></div>
</header>
<div class="bar">

 <button id="bi">استيراد بيانات</button>
 <button id="be">تصدير نسخة احتياطية</button>

</div>
<main id="m">
 <div class="zoom"><button id="zi">+</button><button id="zo">−</button><button id="zf">⤢</button><button id="zk">K1</button></div>
 <div class="leg"><span><i style="background:var(--slot)"></i>فارغ</span><span><i style="background:#1b3a8a"></i>مشغول</span><span><i style="background:var(--hl)"></i>نتيجة البحث</span></div>
 <svg id="s"><g id="v"></g></svg>
</main>
<footer>Developed by Mohammed Mutasim (4223) &amp; Mohammed Tareq (4224)</footer>
<div id="tip"></div><div id="toast"></div>
<div class="ov" id="ov"><div class="dlg" id="dl"></div></div>
<script>
const KEY="saaed_yard_v2",C=.866;

const ROWS=[["ازرق","هوندا اكور","87643","13"],["ذهبي","تويوتا كامري","17994","15"],["ابيض","ميستبوشي","39881","17"],["رصاصي","هوندا","58303","5"],["ابيض","نيسان بيكب","47280","1 - عمومي"],["اسود","جنسس","94783","50"],["ابيض","تويوتا باص صغير","63425","17"],["اسود","شفرولية","60327","17"],["ابيض","نيسان التيما","72076","تجاري 2024"],["ابيض","نيسان صني","89435","18"],["رصاصي","نيسان تيدا","49868","8"],["اسود","باجيرو","",""],["سودا","تويوتا كورلا","",""],["اسود","هوندا اكورد","",""],["ابيض","هوندا مني باص","35965","14"],["ابيض","شفرولية","74573","14"],null,["اصفر","مني كوبر","",""],["اسود","هوندا اكورد","87684","12"],["اسود","تويوتا كامري","72866","6"],["ابيض","نيسان بيكب","",""],["ابيض","مزدا","27856","18"],["ابيض","رنج","6688","7"],["اسود","موستنق شفرولية","",""],["اسود","لكزس","32814","10"],["رصاصي","نيسان تيدا","",""],["احمر","جيمس","",""]];
const LANES=[{id:"K1",x:495,y:709,len:638,d:43,main:1}];
for(let k=0;k<8;k++)LANES.push({id:"K"+(5+k),x:407,y:610-k*52.29,len:583,d:40,n:20,red:k==7});
[419,483,547].forEach((y,i)=>LANES.push({id:"K4-"+(i+1),x:97,y,len:259,d:40,n:9}));
let S,hl=null,moving=null,view={x:0,y:0,k:1};
const $=id=>document.getElementById(id),ln=l=>l.main?S.n:l.n,LN=id=>LANES.find(l=>l.id===id),at=(l,i)=>S.cars.find(c=>c.lane===l&&c.slot===i),lbl=id=>id.replace("K4-","K4 صف ");
function seed(){return{n:27,cars:ROWS.map((r,i)=>r?{id:i+1,lane:"K1",slot:i+1,color:r[0],model:r[1],plate:r[2],cat:r[3],note:"",alert:false}:{id:i+1,lane:"K1",slot:i+1,color:"رصاصي",model:"راف فور",plate:"54307",cat:"5",note:"عدم فكها إلا بعد مراجعة المشرف طالب",alert:true})}}
function load(){try{const r=localStorage.getItem(KEY);S=r?JSON.parse(r):seed()}catch(e){S=seed()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function toast(t){const e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",2800)}
const P=(x,y,z)=>[(x-y)*C,(x+y)*.5-z];
const pts=a=>a.map(p=>P(...p).map(v=>v.toFixed(1)).join(",")).join(" ");
function box(x,y,w,d,z,h,c){const t=z+h,k=' stroke="rgba(0,0,0,.28)" stroke-width=".5"';return`<polygon${k} points="${pts([[x+w,y,z],[x+w,y+d,z],[x+w,y+d,t],[x+w,y,t]])}" fill="${c}" style="filter:brightness(.82)"/><polygon${k} points="${pts([[x,y+d,z],[x+w,y+d,z],[x+w,y+d,t],[x,y+d,t]])}" fill="${c}" style="filter:brightness(.66)"/><polygon${k} points="${pts([[x,y,t],[x+w,y,t],[x+w,y+d,t],[x,y+d,t]])}" fill="${c}"/>`}
const R=(x,y,w,d,z,f,s,sw)=>`<polygon points="${pts([[x,y,z],[x+w,y,z],[x+w,y+d,z],[x,y+d,z]])}" fill="${f}"${s?` stroke="${s}" stroke-width="${sw||1}"`:""}/>`;
function chip(x,y,t,o={}){const[px,py]=P(x,y,0),w=o.w||Math.max(40,t.length*8+16);return`<g><rect x="${(px-w/2).toFixed(1)}" y="${(py-11).toFixed(1)}" width="${w}" height="22" rx="7" fill="${o.bg||"var(--card)"}" stroke="${o.bd||"var(--line)"}"/><text x="${px.toFixed(1)}" y="${(py+4).toFixed(1)}" text-anchor="middle" font-size="${o.fs||12}" font-weight="700" fill="${o.c||"var(--ink)"}">${t}</text></g>`}
function render(){const WL="#1b3a8a",gold={bg:"#b9812a",bd:"#b9812a",c:"#fff",w:44},blue={bg:"#1b3a8a",bd:"#1b3a8a",c:"#fff"};let h=R(92,127,1138,630,0,"var(--ground)"),ch="",tot=0;
 h+=R(326,132,704,83,0,"var(--zone)","var(--zl)",1.5)+R(97,132,200,252,0,"var(--zone)","var(--zl)",1.5)+R(1141,227,84,525,0,"var(--zone)","var(--zl)",1.5);
 h+=box(92,127,1138,10,0,14,WL)+box(92,127,10,630,0,14,WL);
 [["شاحنات",917,173],["مقطورات",778,173],["كرفانات",637,173],["بوبكات",497,173],["شاحنات",250,203],["مقطورات",150,203],["باصات",250,259],["كرفانات",150,259],["شيول",250,315],["بوبكات",150,315],["باصات",1182,315],["تنكر",1182,398],["صهاريج",1182,482],["ثلاجات",1182,565],["سيارات",1182,649]].forEach(a=>ch+=chip(a[1],a[2],a[0],{w:a[0].length>6?72:62}));
 ch+=chip(361,173,"K3",gold)+chip(197,155,"K4",gold)+chip(1182,253,"K2",gold);
 let arc=[];for(let i=0;i<=24;i++){const a=Math.PI*i/24,p=P(380+47*Math.cos(a),747-47*Math.sin(a),0);arc.push(p[0].toFixed(1)+","+p[1].toFixed(1))}
 h+=`<polyline points="${arc.join(" ")}" fill="none" stroke="#1b3a8a" stroke-width="1.5" stroke-dasharray="5 4"/>`;
 [...LANES].sort((a,b)=>(a.x*2+a.len+a.y*2+a.d)-(b.x*2+b.len+b.y*2+b.d)).forEach(l=>{const n=ln(l),w=l.len/n;tot+=n;
  for(let i=1;i<=n;i++){const x=l.x+(i-1)*w,car=at(l.id,i),on=hl===l.id+":"+i;
   h+=`<g class="slot" data-l="${l.id}" data-s="${i}">`+R(x,l.y,w,l.d,0,l.red?"var(--red)":"var(--slot)","#fff",1.2).replace("<polygon",'<polygon class="sp"');
   if(car){const c=car.alert?"#d92d20":COL[car.color]||"#7a8bb0";h+=box(x+2.5,l.y+5,w-5,l.d-10,0,8,c)+box(x+4,l.y+13,w-8,l.d-26,8,6,c)}
   if(on)h+=R(x-1,l.y-1,w+2,l.d+2,.3,"none","var(--hl)",3).replace("<polygon",'<polygon class="hl"');
   const[lx,ly]=P(x+w/2,l.y-(l.main?14:6),0);h+=`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" font-size="${l.main?9:8}" font-weight="700" fill="${on?"var(--hl)":"var(--ink)"}" stroke="var(--bg)" stroke-width="3" paint-order="stroke">${i}</text></g>`}
  ch+=l.main?chip(466,l.y+22,"K1",{...blue,w:44}):l.id[2]=="-"?chip(378,l.y+20,"K4",{...blue,w:38}):chip(1042,l.y+20,l.id,l.red?{...blue,bg:"#b53a2c",bd:"#b53a2c",w:44}:{...blue,w:44})});
 h+=box(157,633,124,119,0,46,"#2d4f9e")+R(192,662,52,26,46.3,"#cfdcf3","#fff",1.5)+R(192,696,52,26,46.3,"#cfdcf3","#fff",1.5);
 ch+=chip(218,610,"🚗 دورية",{w:76});
 h+=box(1220,127,10,630,0,5,WL)+box(92,747,241,10,0,5,WL)+box(428,747,802,10,0,5,WL)+box(322,741,11,16,0,22,WL)+box(428,741,11,16,0,22,WL);
 h+=`<polygon points="${pts([[378,776,0],[396,796,0],[386,796,0],[386,815,0],[370,815,0],[370,796,0],[360,796,0]])}" fill="#c0392b"/>`;
 ch+=chip(378,842,"المدخل ENTRANCE",{w:130});
 $("v").innerHTML=h+ch;$("sc").textContent=S.cars.length;$("st").textContent=tot;$("se").textContent=tot-S.cars.length;$("n").value=S.n}
function apply(){$("v").setAttribute("transform",`translate(${view.x} ${view.y}) scale(${view.k})`)}
function fitBox(b){const r=$("m").getBoundingClientRect(),c=[[b[0],b[1]],[b[2],b[1]],[b[2],b[3]],[b[0],b[3]]].map(p=>P(p[0],p[1],0)),xs=c.map(p=>p[0]),ys=c.map(p=>p[1]),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys)-30,y1=Math.max(...ys)+14;view.k=Math.min(r.width/(x1-x0),r.height/(y1-y0))*.94;view.x=r.width/2-(x0+x1)/2*view.k;view.y=r.height/2-(y0+y1)/2*view.k;apply()}
function fit(){fitBox([70,105,1255,870])}
function focus(id,i){const l=LN(id),w=l.len/ln(l),[px,py]=P(l.x+(i-.5)*w,l.y+l.d/2,0),r=$("m").getBoundingClientRect();view.k=Math.max(view.k,3);view.x=r.width/2-px*view.k;view.y=r.height/2-py*view.k;apply()}
function zoom(f,cx,cy){const r=$("m").getBoundingClientRect();cx=cx??r.width/2;cy=cy??r.height/2;const k=Math.min(8,Math.max(.15,view.k*f)),q=k/view.k;view.x=cx-(cx-view.x)*q;view.y=cy-(cy-view.y)*q;view.k=k;apply()}
const svg=$("s");let drag=null,moved=0;
svg.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};moved=0});
addEventListener("pointermove",e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;moved=Math.max(moved,Math.abs(dx)+Math.abs(dy));if(moved>5){view.x=drag.vx+dx;view.y=drag.vy+dy;apply();tip(0)}});
addEventListener("pointerup",()=>drag=null);
svg.addEventListener("wheel",e=>{e.preventDefault();const r=$("m").getBoundingClientRect();zoom(e.deltaY<0?1.12:.89,e.clientX-r.left,e.clientY-r.top)},{passive:false});
$("zi").onclick=()=>zoom(1.3);$("zo").onclick=()=>zoom(.77);$("zf").onclick=fit;$("zk").onclick=()=>fitBox([470,670,1150,770]);
function tip(car,e){const t=$("tip");if(!car){t.style.display="none";return}t.innerHTML=`${lbl(car.lane)} • باركن <b>${car.slot}</b><br>لوحة: ${car.plate||"بدون"}<br>${car.model}${car.alert?"<br>⚠ تنبيه":""}`;t.style.display="block";t.style.left=Math.min(e.clientX+14,innerWidth-170)+"px";t.style.top=(e.clientY+14)+"px"}
svg.addEventListener("pointermove",e=>{if(drag&&moved>5)return;const g=e.target.closest(".slot");tip(g&&at(g.dataset.l,+g.dataset.s),e)});
svg.addEventListener("pointerleave",()=>tip(0));
svg.addEventListener("click",e=>{if(moved>5)return;const g=e.target.closest(".slot");if(!g)return;const l=g.dataset.l,i=+g.dataset.s,car=at(l,i);
 if(moving){if(car){toast("هذا الموقف مشغول، اختر موقفاً فارغاً");return}const m=S.cars.find(c=>c.id===moving);m.lane=l;m.slot=i;moving=null;hl=l+":"+i;save();render();toast("تم النقل إلى "+lbl(l)+" باركن "+i);return}
 car?details(car):form(null,l,i)});
addEventListener("keydown",e=>{if(e.key==="Escape"){moving=null;close()}});
function open(h){$("dl").innerHTML=h;$("ov").style.display="flex"}function close(){$("ov").style.display="none"}
$("ov").addEventListener("click",e=>{if(e.target.id==="ov")close()});
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function form(car,lane,slot){const c=car||{plate:"",model:"",color:"",cat:"",note:"",alert:false};
 open(`<h3>${car?"تعديل سيارة":"إضافة سيارة"} – ${lbl(lane)} باركن ${slot}</h3><div class="f"><label>رقم اللوحة<input id="fp" value="${esc(c.plate)}"></label><label>الفئة<input id="fc" value="${esc(c.cat)}"></label><label>نوع السيارة / الماركة والموديل<input id="fm" value="${esc(c.model)}"></label><label>اللون<input id="fo" list="cl" value="${esc(c.color)}"></label><label class="w">ملاحظة<input id="fn" value="${esc(c.note)}"></label><label class="w" style="flex-direction:row;align-items:center"><input type="checkbox" id="fa" style="width:auto" ${c.alert?"checked":""}> تمييز السيارة بالأحمر (تنبيه)</label></div><datalist id="cl">${["أبيض","أسود","رصاصي","أزرق","ذهبي","أصفر","أحمر"].map(x=>`<option>${x}</option>`).join("")}</datalist><div class="row"><button class="p" id="ok">حفظ</button><button onclick="close()">إلغاء</button></div>`);
 $("ok").onclick=()=>{const m=$("fm").value.trim();if(!m){toast("أدخل نوع السيارة");return}const d={plate:$("fp").value.trim(),cat:$("fc").value.trim(),model:m,color:$("fo").value.trim(),note:$("fn").value.trim(),alert:$("fa").checked};
  if(car)Object.assign(car,d);else S.cars.push({id:Date.now(),lane,slot,...d});hl=lane+":"+slot;save();render();close()}}
function details(c){open(`<h3>${lbl(c.lane)} – باركن ${c.slot}</h3><table><tr><td>رقم اللوحة</td><td>${esc(c.plate)||"بدون"}</td></tr><tr><td>الفئة</td><td>${esc(c.cat)||"بدون"}</td></tr><tr><td>نوع السيارة</td><td>${esc(c.model)}</td></tr><tr><td>اللون</td><td>${esc(c.color)||"-"}</td></tr>${c.note?`<tr><td>ملاحظة</td><td style="color:var(--bad);font-weight:700">${esc(c.note)}</td></tr>`:""}</table><div class="row"><button id="e1">تعديل</button><button id="e2">نقل</button><button class="d" id="e3">إزالة</button><span class="sp2"></span><button onclick="close()">إغلاق</button></div>`);
 $("e1").onclick=()=>form(c,c.lane,c.slot);$("e2").onclick=()=>{moving=c.id;close();toast("اضغط على موقف فارغ لنقل السيارة (Esc للإلغاء)")};
 $("e3").onclick=()=>{if(!confirm("إزالة هذه السيارة؟"))return;S.cars=S.cars.filter(x=>x.id!==c.id);hl=null;save();render();close()}}
function find(v){v=v.trim();hl=null;if(v){const m=v.match(/^(k\d+(?:-\d)?)[\s:\-]+(\d+)$/i);if(m)hl=m[1].toUpperCase()+":"+(+m[2]);else{const c=S.cars.find(c=>c.plate&&c.plate.includes(v));if(c)hl=c.lane+":"+c.slot;else if(/^\d+$/.test(v)&&+v<=S.n)hl="K1:"+(+v)}}
 render();if(hl){const a=hl.split(":");focus(a[0],+a[1])}}
$("q").oninput=e=>find(e.target.value);
$("n").onchange=e=>{const v=Math.max(1,Math.min(200,+e.target.value||S.n)),mx=Math.max(0,...S.cars.filter(c=>c.lane==="K1").map(c=>c.slot));if(v<mx){toast("لا يمكن التقليل، يوجد سيارة في باركن "+mx);e.target.value=S.n;return}S.n=v;save();render()};
$("be").onclick=()=>{open(`<h3>نسخة احتياطية</h3><p style="font-size:13px;color:var(--mut)">انسخ النص واحفظه في ملف. لاستعادته استخدم زر استيراد نسخة احتياطية.</p><textarea id="ta" rows="10" style="width:100%;direction:ltr" readonly>${esc(JSON.stringify(S))}</textarea><div class="row"><button class="p" id="cp">نسخ</button><button onclick="close()">إغلاق</button></div>`);
 $("cp").onclick=()=>{$("ta").select();try{navigator.clipboard.writeText($("ta").value)}catch(e){document.execCommand("copy")}toast("تم النسخ")}};
$("bk").onclick=()=>{open(`<h3>استيراد نسخة احتياطية</h3><p style="font-size:13px;color:var(--mut)">الصق النص أو اختر الملف. سيتم استبدال البيانات الحالية.</p><input type="file" id="fl" accept=".json,.txt"><textarea id="ta" rows="8" style="width:100%;direction:ltr;margin-top:8px"></textarea><div class="row"><button class="p" id="go">استيراد</button><button onclick="close()">إلغاء</button></div>`);
 $("fl").onchange=e=>{const f=e.target.files[0];if(f){const r=new FileReader;r.onload=()=>$("ta").value=r.result;r.readAsText(f)}};
 $("go").onclick=()=>{try{const d=JSON.parse($("ta").value);if(!d||!Array.isArray(d.cars)||!(d.n>0))throw 0;S={n:+d.n,cars:d.cars.map(c=>({id:c.id||Date.now()+Math.random(),lane:LN(c.lane)?c.lane:"K1",slot:+c.slot,plate:c.plate||"",cat:c.cat||"",model:c.model||"",color:c.color||"",note:c.note||"",alert:!!c.alert}))};save();render();fit();close();toast("تم الاستيراد")}catch(e){toast("ملف غير صالح")}}};
$("bi").onclick=()=>{open(`<h3>استيراد بيانات السيارات</h3><p style="font-size:13px;color:var(--mut)">الصق البيانات (سطر لكل سيارة): اللون، النوع، اللوحة، الفئة. افصل بين الأعمدة بـ Tab أو فاصلة. ثم راجعها قبل الإضافة. للـ PDF: انسخ الجدول منه والصقه هنا.</p><textarea id="ta" rows="7" style="width:100%"></textarea><div id="pv"></div><div class="row"><button id="pr">معاينة</button><button class="p" id="ad" style="display:none">إضافة للمواقف الفارغة</button><button onclick="close()">إلغاء</button></div>`);
 let rows=[];$("pr").onclick=()=>{rows=$("ta").value.split(/\n/).map(l=>l.split(/\t|,|،|\s{2,}/).map(x=>x.trim())).filter(r=>r.length>=2&&r[1]).map(r=>({color:r[0],model:r[1],plate:/^(بدون)?$/.test(r[2]||"")?"":r[2],cat:/^(بدون)?$/.test(r[3]||"")?"":r[3]}));
  $("pv").innerHTML=rows.length?`<table><tr><th>اللون</th><th>النوع</th><th>اللوحة</th><th>الفئة</th></tr>${rows.map(r=>`<tr><td>${esc(r.color)}</td><td>${esc(r.model)}</td><td>${esc(r.plate)||"بدون"}</td><td>${esc(r.cat)||"بدون"}</td></tr>`).join("")}</table>`:"لم يتم التعرف على بيانات";$("ad").style.display=rows.length?"":"none"};
 $("ad").onclick=()=>{let a=0;outer:for(const r of rows){for(const l of LANES)for(let i=1;i<=ln(l);i++)if(!at(l.id,i)){S.cars.push({id:Date.now()+a,lane:l.id,slot:i,note:"",alert:false,...r});a++;continue outer}break}save();render();close();toast(`تمت إضافة ${a} من ${rows.length}`)}};
load();render();fit();addEventListener("resize",fit);
</script>
</body>
</html>
